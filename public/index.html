<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Messenger — Real-Time Chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- Login / User Picker Modal -->
  <div id="login-overlay" class="login-overlay" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="login-card">
      <div class="login-brand">
        <div class="messenger-logo" aria-hidden="true">
          <svg viewBox="0 0 36 36" width="36" height="36" fill="none">
            <path
              d="M18 3C9.716 3 3 9.218 3 16.89c0 4.37 2.182 8.268 5.595 10.816V33l5.106-2.804c1.363.377 2.807.583 4.299.583 8.284 0 15-6.218 15-13.89S26.284 3 18 3Z"
              fill="#0084FF"
            />
            <path
              d="M19.49 20.54 15.67 16.47 8.21 20.54l8.2-8.71 3.91 4.07 7.37-4.07-8.2 8.71Z"
              fill="#FFFFFF"
            />
          </svg>
        </div>
        <h1 id="login-title">Welcome to Messenger</h1>
        <p class="login-subtitle">Select an account or enter an existing User ID to start chatting.</p>
      </div>

      <div class="login-section">
        <span class="login-section-label">Quick Select User</span>
        <div id="user-picker-list" class="user-picker-list">
          <div class="picker-loading">Loading users...</div>
        </div>
      </div>

      <div class="login-divider">
        <span>or enter user ID</span>
      </div>

      <form id="login-form" class="login-form" autocomplete="off">
        <div class="login-input-row">
          <input
            id="userid-input"
            type="text"
            class="login-input"
            placeholder="Enter fld_userid (e.g. poty, juan01, maria02)"
            maxlength="100"
            required
          />
          <button type="submit" id="login-submit-btn" class="login-submit-btn">Continue</button>
        </div>
        <p id="login-error" class="login-error" role="alert" hidden></p>
      </form>
    </div>
  </div>

  <!-- Main Messenger Shell -->
  <div id="app-shell" class="app-shell" hidden>
    <!-- Mobile backdrop for sidebar drawer -->
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <!-- Left Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="Conversations and online users">
      <div class="sidebar-header">
        <div class="sidebar-title-wrap">
          <h2 class="sidebar-title">Chats</h2>
          <span id="sidebar-online-pill" class="online-count-pill">0 online</span>
        </div>

        <div class="current-user-controls">
          <div id="current-user-chip" class="current-user-chip" title="Logged in user"></div>
          <button
            type="button"
            id="switch-user-btn"
            class="icon-btn"
            title="Switch user"
            aria-label="Switch user"
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>
      </div>

      <div class="sidebar-search-wrap">
        <div class="sidebar-search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input
            id="sidebar-search-input"
            type="search"
            placeholder="Search Messenger"
            aria-label="Search people and conversations"
          />
        </div>
      </div>

      <div id="conversation-list" class="conversation-list">
        <!-- Rendered dynamically by script.js -->
      </div>
    </aside>

    <!-- Right Panel: Active Chat Thread -->
    <main class="chat-panel">
      <header class="chat-header">
        <div class="chat-header-left">
          <button
            type="button"
            id="mobile-menu-btn"
            class="icon-btn mobile-menu-btn"
            aria-label="Open conversations list"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>

          <div id="chat-header-avatar" class="avatar-wrap"></div>
          <div class="chat-header-meta">
            <h1 id="chat-header-name" class="chat-header-name">Group Chat</h1>
            <p id="chat-header-status" class="chat-header-status">Connecting...</p>
          </div>
        </div>

        <div class="chat-header-right">
          <div id="online-users-indicator" class="online-users-indicator" title="Currently connected users"></div>
        </div>
      </header>

      <div id="connection-banner" class="connection-banner" hidden></div>

      <section id="messages-container" class="messages-container" aria-live="polite">
        <div id="messages-empty" class="messages-empty" hidden>
          <div class="empty-avatar">💬</div>
          <h3>No messages yet</h3>
          <p>Send a message below to start the conversation.</p>
        </div>
        <div id="messages-list" class="messages-list"></div>
      </section>

      <div id="typing-indicator" class="typing-indicator" hidden>
        <span class="typing-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        <span id="typing-text"></span>
      </div>

      <footer class="chat-composer-wrap">
        <form id="message-form" class="chat-composer" autocomplete="off">
          <div class="composer-input-wrap">
            <textarea
              id="message-input"
              class="composer-input"
              placeholder="Aa"
              rows="1"
              maxlength="5000"
              aria-label="Write a message"
            ></textarea>
          </div>
          <button
            type="submit"
            id="send-btn"
            class="send-btn"
            aria-label="Send message"
            disabled
          >
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/script.js"></script>
</body>
</html>
